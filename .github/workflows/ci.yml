name: anchor-ci

on:
  push:
    branches: ["**"]
  pull_request:

env:
  ANCHOR_VERSION: "0.31.1"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps (libudev for hidapi in anchor-cli)
        run: sudo apt-get update && sudo apt-get install -y pkg-config build-essential libudev-dev libusb-1.0-0-dev

      # Modern host Rust: needed so host Cargo can PARSE/RESOLVE the dep tree,
      # much of which has adopted edition2024. The actual on-chain program is
      # compiled by Solana's own platform-tools toolchain (see Anchor build).
      - name: Install host Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo + target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      # Stable channel = recent Agave whose SBF platform-tools Rust supports
      # edition2024, so modern transitive crates compile on-chain without pins.
      - name: Install Solana CLI (stable channel)
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/stable/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Verify Solana
        run: solana --version

      # Cache the compiled anchor binary so we don't rebuild it (~8 min) every run.
      - name: Cache anchor-cli binary
        id: cache-anchor
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/anchor
          key: anchor-cli-${{ env.ANCHOR_VERSION }}-${{ runner.os }}

      # Install anchor-cli directly (no avm, NO --locked) so transitive deps like
      # `time` resolve to versions that compile on stable Rust. Skipped on cache hit.
      - name: Install Anchor CLI
        if: steps.cache-anchor.outputs.cache-hit != 'true'
        run: cargo install --git https://github.com/coral-xyz/anchor --tag v${ANCHOR_VERSION} anchor-cli --force

      - name: Verify Anchor
        run: anchor --version

      - name: Create a Solana keypair (anchor test needs a wallet)
        run: |
          solana-keygen new --no-bip39-passphrase --force -o "$HOME/.config/solana/id.json"
          solana config set --keypair "$HOME/.config/solana/id.json"

      - name: Sync program key into Anchor.toml / declare_id
        run: anchor keys sync || true

      - name: Anchor build
        run: anchor build

      - name: Node setup
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install JS deps
        run: npm install

      - name: Anchor test (spins a local validator)
        run: anchor test --skip-build
