name: anchor-ci

on:
  push:
    branches: ["**"]
  pull_request:

env:
  SOLANA_VERSION: "1.18.26"
  ANCHOR_VERSION: "0.30.1"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Modern host Rust: needed so host Cargo can PARSE/RESOLVE the dep tree,
      # much of which has adopted edition2024. The actual on-chain program is
      # compiled by Solana's own platform-tools toolchain (see Anchor build).
      - name: Install host Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo + target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v${SOLANA_VERSION}/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Verify Solana
        run: solana --version

      # Install anchor-cli directly (no avm, NO --locked) so transitive deps like
      # `time` resolve to versions that compile on stable Rust.
      - name: Install Anchor CLI
        run: |
          cargo install --git https://github.com/coral-xyz/anchor --tag v${ANCHOR_VERSION} anchor-cli --force
          anchor --version

      - name: Sync program key into Anchor.toml / declare_id
        run: anchor keys sync || true

      - name: Generate v3 lockfile + pin SBF-incompatible runtime crates
        run: |
          cargo generate-lockfile
          echo "=== reverse-deps of the offending crypto crates (stable can parse now) ==="
          for c in block-buffer digest crypto-common sha2; do
            echo "----- who pulls $c -----"; cargo tree -i "$c" 2>&1 | head -20 || true
          done
          echo "=== pin RustCrypto runtime chain to last edition2021 releases ==="
          for pin in block-buffer:0.10.4 digest:0.10.7 crypto-common:0.1.6 sha2:0.10.8 sha3:0.10.8 generic-array:0.14.7 cpufeatures:0.2.17; do
            n="${pin%%:*}"; v="${pin##*:}"
            cargo update -p "$n" --precise "$v" 2>/dev/null && echo "pinned $n -> $v" || echo "skip $n"
          done
          sed -i 's/^version = 4$/version = 3/' Cargo.lock
          echo "lockfile header:"; head -3 Cargo.lock

      - name: Anchor build
        run: anchor build

      - name: Node setup
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install JS deps
        run: npm install

      - name: Anchor test (spins a local validator)
        run: anchor test --skip-build
