[package]
name = "last-circle"
version = "0.1.0"
description = "Last Circle Standing — a provably-fair soft-landing pot game with a skill edge"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "last_circle"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = "0.30.1"
# Pin solana-program to match the installed Solana CLI (1.18.26). Without this,
# anchor-lang 0.30.1 floats solana-program to 2.x, pulling edition2024 transitive
# crates (e.g. cpufeatures 0.3) that the 1.18 SBF toolchain can't parse.
solana-program = "=1.18.26"
