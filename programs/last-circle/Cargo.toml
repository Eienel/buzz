[package]
name = "last-circle"
version = "0.1.0"
description = "Last Circle Standing — a provably-fair soft-landing pot game with a skill edge"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "last_circle"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "0.31.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.31.1", features = ["token_2022"] }
switchboard-on-demand = "0.13.0"
